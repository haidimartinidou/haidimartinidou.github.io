title: "Haidi Martinidou"
description: "Neuroscience researcher. I study the brain, behaviour, and the odd things humans do."
url: "https://haidimartinidou.github.io"
baseurl: ""

# Pages appear in this order in the site nav (see _includes/header.html)
# "Odd Things" is the public label; the underlying posts/URLs stay under
# _posts/ and /articles/ since that's just plumbing, not a user-facing name.
nav:
  - title: About
    url: /about/
  - title: Odd Things
    url: /articles/
  - title: Projects
    url: /projects/
  - title: Elsewhere
    url: /elsewhere/
  - title: CV
    url: /cv/

markdown: kramdown
permalink: /articles/:title/

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - .github
