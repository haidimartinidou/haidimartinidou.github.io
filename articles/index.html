---
layout: page
title: Odd Things
permalink: /articles/
---
<ol class="index-list">
  {% for post in site.posts %}
  <li class="index-row">
    <span class="index-num">{{ forloop.index | plus: 100 | slice: 1, 2 }}</span>
    <div class="index-content">
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <span class="index-meta">{{ post.date | date: "%-d %b %Y" }} &mdash; {{ post.excerpt | strip_html | truncatewords: 20 }}</span>
    </div>
  </li>
  {% endfor %}
</ol>
