# Single source of truth for the CV page (/cv/) and the auto-generated PDF
# (assets/cv/Haidi_Martinidou_CV.pdf). Edit this file only; the PDF is
# regenerated by .github/workflows/cv-pdf.yml on every push that touches it.
#
# Gotcha: that workflow's Jekyll build breaks if _config.yml ever stops
# excluding vendor/ (the gem cache the Action installs into gets scanned
# as site content otherwise, and the build fails before the PDF renders).
#
# personal_info.name/email/phone/links also feed the print-only centered
# name/contact header in cv.md (the .cv-print-name / .cv-print-contact
# block, styled in style.css) that appears only in the generated PDF.
#
# personal_info.tagline/summary are merged into one print-only paragraph
# (.cv-print-intro) below that header, without aside; on the live page all
# three (tagline/summary/aside) still show as separate lines.

personal_info:
  name: "Haidi Martinidou"
  tagline: "Neuroscience graduate (BSc Glasgow, MSc King's College London) working toward a PhD in computational neuroscience."
  summary: "Combines quantitative training on large clinical and population datasets with hands-on patient-facing research experience."
  aside: 'Multidisciplinary artist on the side — film and digital photography, painting, and watercolour; more at <a href="https://haidimartinidou.github.io/haidiartin/">haidiartin</a>.'
  interests: >
    My research centres on the mechanisms underlying maladaptive decision-making and mood dysregulation,
    particularly reward processing, prediction-error signalling, and reinforcement learning across healthy
    and clinical populations. This thread connects my past work on fairness-based decision-making and
    diet-related depression risk. I am also interested in subtler, non-clinical disruptions to
    self-regulation, including procrastination, optimism, and hormonal influences on cognition. I approach
    these mechanistic questions as a route toward identifying targets for intervention.
  email: "haidimartinidou@gmail.com"
  phone: "+30 694 2419907"
  links:
    - label: "Personal Website"
      url: "https://haidimartinidou.github.io"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/haidi-martinidou-9b2702173/"
    - label: "GitHub"
      url: "https://github.com/haidimartinidou"
    - label: "ORCID"
      url: "https://orcid.org/0000-0002-6281-2763"

education:
  - degree: "MSc Psychology and Neuroscience of Mental Health (Merit)"
    institution: "King's College London, UK"
    dates: "2021 – 2023"
  - degree: "BSc (Hons) Neuroscience (2:1)"
    institution: "University of Glasgow, UK"
    dates: "2018 – 2021"
    note: "Advanced entry; Class Representative, 2020–2021."

experience:
  - title: "Affiliate Researcher and Research Intern"
    organization: "University of Glasgow, School of Medicine, Dentistry and Nursing (Glasgow and remote)"
    dates: "Jul 2026 – present"
    bullets:
      - "Supervisor: Dr Ourania Varsou. Supporting an evaluation of the University of Glasgow–AAUP medical exchange programme for students studying in conflict-affected settings: entering and verifying questionnaire data, organising consent records and participant documentation."
      - "Wrote the codebook, documented missing-data decisions, and built an analysis-ready workbook; running the quantitative analysis in R (demographics, descriptive statistics, composite scores, ranking analyses)."
      - "Developed the qualitative reflexive thematic analysis (Braun and Clarke) from scratch: coding framework, themes, audit trail and coding matrices, integrated with the quantitative findings."
      - "Wrote a literature review and publication strategy, and drafted the manuscript's Methods, Results and Discussion and an internship report. On-site week in Aug 2026 included shadowing imaging-phantom development and observing MRI scanning."
  - title: "Independent Research Project — EEG Analysis (OpenMIIR)"
    dates: "2026 (ongoing)"
    bullets:
      - "Self-directed, four-stage EEG pipeline on the OpenMIIR music-imagery dataset: preprocessing, stimulus predictor modelling, TRF encoding, and a generative predictive-coding simulation."
      - "Using IDyOM to derive per-note surprise and entropy values as predictors of the EEG response to heard and imagined melodies; preprocessing and acoustic predictor stages complete, symbolic (IDyOM) modelling stage in progress."
      - "Reproducible, version-controlled codebase, built and maintained independently alongside formal coursework."
  - title: "Patient Supporter (Fieldwork)"
    organization: "IQVIA, Global Perspectives, Athens"
    dates: "Nov 2024 – Feb 2026"
    bullets:
      - "Ran end-to-end participant recruitment for pharma-sponsored, non-interventional studies across roughly 20 therapeutic areas, including rare disease: first contact, eligibility screening, DocuSign e-consent, diagnosis verification, scheduling and participant payments."
      - "Held 500+ conversations with patients and caregivers across 10+ projects, acting as recruitment lead on several."
      - "Led recruitment and outreach for a study on VEXAS syndrome: sourced collaborators in the US, including the NIH group that first described the condition, engaged patient organisations in the US and UK, and worked with supporting neurologists."
      - "Handled sensitive health data under clinical governance and GDPR (PII redaction, adverse-event reporting, study documentation and tracking). Recognised internally as \"Excel and AI Champion\"."
  - title: "Merchandise Coordinator and Neuroscience Advisor (remote)"
    organization: "MindHug, London"
    dates: "Aug 2024 – Nov 2024"
    bullets:
      - "Managed end-to-end merchandise operations for workshops across 6 UK universities: sourcing, supplier coordination, budgeting and on-time delivery to events."
      - "Partnered with the lead psychologist to audit workshop slides and materials, translating neuroscience concepts into clear language for student audiences."
  - title: "Clinical Observership — rTMS"
    organization: "NovelBrain, Greece"
    dates: "Jul 2024"
    bullets:
      - "Prepared a review of recent rTMS literature for the clinical team, then observed the clinic's rTMS protocol."
  - title: "HR Coordinator"
    organization: "Caffeine Roastery SuperFoods, Thessaloniki"
    dates: "Oct 2023 – Oct 2024"
    bullets:
      - "Built the HR function from the ground up at launch (recruitment, onboarding, core policies) for a team of 10."
      - "Designed and ran structured interviews and onboarding, drawing on motivation and person–role fit."
  - title: "Master's Dissertation — Reward, Risk, and Fairness Processing"
    organization: "King's College London"
    dates: "2022 – 2023"
    subtitle: "\"The Connection Between Processing Fairness and Reward-Risk Prediction in the Human Brain\""
    bullets:
      - "Narrative synthesis screening over 350 papers and synthesising 10 in depth, across fMRI, EEG, PET, TMS, and tDCS."
      - "Concluded that reinforcement-learning prediction-error mechanisms underpin social decision-making, linking reward computation to processes usually studied separately in the fairness literature."
      - "Supervisor: Dr Gisele Dias."
  - title: "Undergraduate Dissertation — Diet and Depression Risk"
    organization: "University of Glasgow"
    dates: "2020 – 2021"
    subtitle: "\"The Association Between Mediterranean Diet and Depression Risk\""
    bullets:
      - "Analysed UK Biobank data (N = 502,359) using binary logistic regression in Stata, testing six Mediterranean-style dietary components (oily and non-oily fish, fruit, salad and raw vegetables, cooked vegetables, processed meat) against self-reported depression."
      - "Used stepwise adjustment for age, sex, smoking, medication, area deprivation, education and month of assessment; small protective associations persisted, largest for oily fish (OR 0.90). Now being prepared as a manuscript."
      - "Supervisor: Dr Donald Lyall."
  - title: "Living Support Assistant"
    organization: "University of Glasgow, Kelvinhaugh Residences"
    dates: "Sep 2019 – Jun 2020"
    bullets:
      - "Overnight on-call welfare cover (18:00–07:00) for student residents, responding to emergencies including mental-health crises and safety incidents."
      - "Ran wellbeing check-ins and mediated flat conflicts; trained in Mental Health First Aid, First Aid, Fire and Life Safety, and mediation. Role ended due to COVID-19."

skills:
  - category: "Research and data"
    items: "R (basic: descriptive statistics, regression, composite scores); Python (basic: MNE-based EEG preprocessing in the OpenMIIR pipeline); IBM SPSS; Stata; Excel (advanced); questionnaire data management and codebooks; reflexive thematic analysis; systematic literature screening and narrative synthesis; digital brain atlas tools (QuickNII, MeshView); running IDyOM (Common Lisp)."
  - category: "Software"
    items: "DocuSign, Notion, Obsidian, ClickUp, Canva Pro, Adobe Premiere, SoftOne, Microsoft Office, GitHub Pages."
  - category: "Certificates"
    items: "Mental Health First Aid, First Aid, Fire and Life Safety (University of Glasgow, 2019); adverse-event reporting and compliance training (IQVIA)."
  - category: "Languages"
    items: "Greek (native); English (fluent); French (basic, learning)."
  - category: "Music and arts"
    items: "Choir, Filippos Glee, Athens (2025–2026); jazz singing lessons; lead singer with local bands, including a fundraising concert (2016–2019); Megaro Mousikis Thessalonikis choir (2011–2014); violin, Conservatory of Northern Greece (2008–2014; lead violin 2012, awards of excellence); theatre training, Andreas Voutsinas drama school (2007–2014)."

