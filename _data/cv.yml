personal_info:
  name: "Haidi Martinidou"
  tagline: "Neuroscience graduate (BSc Glasgow, MSc King's College London) working toward a PhD in computational neuroscience."
  summary: "Combines quantitative training on large clinical/population datasets with hands-on patient-facing research experience."
  aside: 'Multidisciplinary artist on the side — film and digital photography, painting, and watercolour; more at <a href="https://haidimartinidou.github.io/haidiartin/">haidiartin</a>.'
  interests: >
    My research interests concern the mechanisms underlying maladaptive decision-making and mood dysregulation,
    with particular attention to reward processing, prediction-error signalling, and reinforcement learning as
    they operate across both healthy and clinical populations. This thread runs through my work to date, from
    fairness-based decision-making to diet-related depression risk. I am additionally interested in subtler,
    non-clinical disruptions to self-regulation and choice behaviour, including procrastination, optimism, and
    hormonal influences on cognition. My training is grounded in neuroscience and psychology, and I aim to
    approach mechanistic questions primarily as a route toward identifying targets for intervention and treatment.
  email: "haidimartinidou@gmail.com"
  phone: "+30 694 2419907"
  links:
    - label: "Personal Website"
      url: "https://haidimartinidou.github.io"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/haidi-martinidou-9b2702173/"
    - label: "GitHub"
      url: "https://github.com/haidimartinidou"

