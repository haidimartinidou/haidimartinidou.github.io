# Single source of truth for the CV page (/cv/).
#
# The page's download button points to the manually-supplied
# /files/Martinidou_CV.pdf. The old .github/workflows/cv-pdf.yml auto-PDF
# workflow has been retired (2026-11) since nothing links to its output
# any more; see that commit for removal details.
#
# personal_info.name/email/phone/links also feed the print-only centered
# name/contact header in cv.md (the .cv-print-name / .cv-print-contact
# block, styled in style.css) that appears only in the generated PDF.
#
# personal_info.tagline/summary are merged into one print-only paragraph
# (.cv-print-intro) below that header, without aside; on the live page all
# three (tagline/summary/aside) still show as separate lines.

personal_info:
  name: "Haidi Martinidou"
  tagline: "Neuroscience graduate (BSc Glasgow, MSc King's College London) interested in how chronic stress changes the brain's reward and memory systems to produce anhedonia and apathy, why some brains are more resilient, and whether protecting these systems earlier can delay dementia."
  summary: "My work combines large-cohort analysis, evidence synthesis and patient-facing research."
  aside: 'I also make visual art: film and digital photography, painting and watercolour, at <a href="https://haidimartinidou.github.io/haidiartin/">haidiartin</a>.'
  interests: "Chronic stress and depression; reward processing and motivation (anhedonia, apathy); memory systems; stress resilience; dementia risk and prevention."
  email: "haidimartinidou@gmail.com"
  phone: "+30 694 2419907"
  links:
    - label: "Personal Website"
      url: "https://haidimartinidou.github.io"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/haidi-martinidou-9b2702173/"
    - label: "GitHub"
      url: "https://github.com/haidimartinidou"
    - label: "ORCID"
      url: "https://orcid.org/0000-0002-6281-2763"

education:
  - degree: "MSc Psychology and Neuroscience of Mental Health (Merit)"
    institution: "King's College London, UK"
    dates: "2021 – 2023"
  - degree: "BSc (Hons) Neuroscience (2:1)"
    institution: "University of Glasgow, UK"
    dates: "2018 – 2021"
    note: "Advanced entry; Class Representative, 2020–2021."
  - degree: "PhD-level course IMB9345: Neuroscience Data Integration through Use of Digital Brain Atlases (online, 2 ECTS, passed)"
    institution: "University of Oslo, Faculty of Medicine (Neural Systems Laboratory, EBRAINS), Norway"
    dates: "Sep 2026"

experience:
  - title: "Affiliate Researcher and Research Intern (supervisor: Dr Ourania Varsou)"
    organization: "University of Glasgow, School of Medicine, Dentistry and Nursing (Glasgow, UK and remote)"
    dates: "Jul 2026 – present"
    bullets:
      - "Co-lead, with Dr Varsou (joint first authors), a mixed-methods evaluation of a medical exchange between the University of Glasgow and the Arab American University Palestine (AAUP) for students in conflict-affected settings."
      - "Built the master dataset: entered and verified survey responses, wrote the codebook and documented every missing-data decision."
      - "Ran the quantitative analysis (descriptive statistics, composite scores, modified Borda scoring of rankings) and the reflexive thematic analysis (Braun and Clarke), integrating both into a transferable framework for international medical exchange programmes."
      - "Drafted the literature review, Methods, Results and Discussion; preparing the full manuscript. Abstract submitted to the 20th Annual University of Glasgow Learning &amp; Teaching Conference (April 2027)."
  - title: "Independent Research Project — EEG Analysis (OpenMIIR)"
    dates: "2026 (ongoing)"
    bullets:
      - "Self-directed, four-stage EEG pipeline on the OpenMIIR music-imagery dataset: preprocessing, stimulus predictor modelling, TRF encoding, and a generative predictive-coding simulation."
      - "Using IDyOM to derive per-note surprise and entropy values as predictors of the EEG response to heard and imagined melodies; preprocessing and acoustic predictor stages complete, symbolic (IDyOM) modelling stage in progress."
      - "Reproducible, version-controlled codebase, built and maintained independently alongside formal coursework."
  - title: "Patient Supporter (Fieldwork)"
    organization: "IQVIA, Global Perspectives, Athens"
    dates: "Nov 2024 – Feb 2026"
    subtitle: "Recognised internally as \"Excel and AI Champion\"."
    bullets:
      - "Ran end-to-end participant recruitment for pharma-sponsored, non-interventional studies across 20+ therapeutic areas: eligibility screening, e-consent, diagnosis verification and scheduling."
      - "Held 500+ conversations with patients and caregivers across 10+ projects, as recruitment lead on several; nominated by my manager to train as a patient-experience interviewer."
      - "Built recruitment routes for rare and underdiagnosed conditions with no ready participant pool, through outreach to patient organisations, advocates and online communities in the US and UK (e.g., a VEXAS syndrome study)."
      - "Handled sensitive health data under GDPR and industry codes (BHBIA, EPHMRA): PII redaction and adverse-event reporting."
  - title: "Merchandise Coordinator and Neuroscience Advisor (remote)"
    organization: "MindHug, London"
    dates: "Aug 2024 – Nov 2024"
    bullets:
      - "Managed end-to-end merchandise operations for workshops across 6 UK universities: sourcing, supplier coordination, budgeting and on-time delivery to events."
      - "Partnered with the lead psychologist to audit workshop slides and materials, translating neuroscience concepts into clear language for student audiences."
  - title: "Clinical Observership — rTMS"
    organization: "NovelBrain, Greece"
    dates: "Jul 2024"
    bullets:
      - "Prepared a review of recent rTMS literature for the clinical team, then observed the clinic's rTMS protocol."
  - title: "HR Coordinator"
    organization: "Caffeine Roastery SuperFoods, Thessaloniki"
    dates: "Oct 2023 – Oct 2024"
    bullets:
      - "Built the HR function from the ground up at launch, including recruitment, onboarding and core policies, for a team of 10 staff."
      - "Trained and worked front-of-house shifts (barista, cashier, food preparation) to understand each role first-hand, then designed structured interviews and onboarding around them."
  - title: "Editorial and Administrative Assistant"
    organization: "psychology.gr"
    dates: "Jan 2024 – Mar 2024"
    bullets:
      - "Proofread, formatted and search-engine-optimised articles on psychology and mental health before publication."
      - "Coordinated online webinar events, including scheduling and answering participant questions."
  - title: "Sales and Administration"
    organization: "Alterlife"
    dates: "Jan 2023 – Aug 2023"
    bullets:
      - "Prepared weekly and monthly financial reports feeding into the chain's monthly department ranking across 75 branches; the department placed first or second most months."
      - "Trained in communication, the customer funnel and sales technique: greeting, touring and converting walk-in enquiries without working on commission."
      - "Built strong clientele relationships; received extensive training in managerial communication and the role itself."
  - title: "Master's Dissertation — Reward, Risk, and Fairness Processing"
    organization: "King's College London"
    dates: "2022 – 2023"
    subtitle: "\"The Connection Between Processing Fairness and Reward-Risk Prediction in the Human Brain\""
    bullets:
      - "Narrative synthesis screening over 350 papers and synthesising 10 in depth, across fMRI, EEG, PET, TMS, and tDCS."
      - "Found valuation and prediction-error signals across methods, but the literature could not show whether an unfair outcome drives learning or reflects a stable way of weighting outcomes."
      - "Supervisor: Dr Gisele Dias."
  - title: "Undergraduate Dissertation — Diet and Depression Risk"
    organization: "University of Glasgow"
    dates: "2020 – 2021"
    subtitle: "\"The Association Between Mediterranean Diet and Depression Risk\""
    bullets:
      - "Analysed UK Biobank data (N = 502,359) using binary logistic regression in Stata, testing six Mediterranean-style dietary components (oily and non-oily fish, fruit, salad and raw vegetables, cooked vegetables, processed meat) against self-reported depression."
      - "Used stepwise adjustment for age, sex, smoking, medication, area deprivation, education and month of assessment; small protective associations persisted, largest for oily fish (OR 0.90). Now being prepared as a manuscript."
      - "Supervisor: Dr Donald Lyall."
  - title: "Living Support Assistant"
    organization: "University of Glasgow, Kelvinhaugh Residences"
    dates: "Aug 2019 – Jun 2020"
    bullets:
      - "Overnight on-call welfare cover (18:00–07:00) for student residents, responding to emergencies including mental-health crises and safety incidents."
      - "Ran wellbeing check-ins and mediated flat conflicts; trained in Mental Health First Aid, First Aid, Fire and Life Safety, and mediation. Role ended due to COVID-19."

